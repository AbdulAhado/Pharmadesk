name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native SQLite module for Electron
        run: npm run rebuild

      - name: Run test suite
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Build Windows Installer & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaDesk-Windows-Installer
          path: |
            dist/PharmaDesk Setup.exe
            dist/latest.yml
            dist/*.blockmap

